[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronox"
version = "0.1.0.dev0"
description = "Coordinated low-light themes for Linux developer tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["configobj>=5.0.8,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
aeronox = "aeronox.cli:main"

[tool.setuptools]
packages = ["aeronox", "aeronox.adapters", "aeronox.palettes", "aeronox.vscode_assets"]

[tool.setuptools.package-data]
"aeronox.palettes" = ["*.json"]
"aeronox.vscode_assets" = ["*.jsonc", "GUIDE.md"]

[tool.setuptools.package-dir]
"aeronox" = "src/aeronox"
"aeronox.palettes" = "palettes"
"aeronox.vscode_assets" = "assets/vscode"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
