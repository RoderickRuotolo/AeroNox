# Synthetic configuration: never copied from a real HOME.
[global_config]
  focus = sloppy
  enabled_plugins = LaunchpadBugURLHandler, TestSynthetic
[keybindings]
  split_horiz = <Primary><Shift>o
[profiles]
  # Personal default, preserved exactly.
  [[default]] # original header comment
    font = Monospace 13
    use_system_font = False
    cursor_shape = ibeam
    cursor_blink = True
    cursor_color = "#ABABAB"
    scrollback_lines = 15000
    scrollback_infinite = True
    use_theme_colors = True
    foreground_color = "#EEEEEE" # keep this comment
    background_color = "#101020"
    background_type = transparent
    background_darkness = 0.85
    custom_command = "echo SYNTHETIC#COMMAND"
    use_custom_command = False
    unknown_option = preserved
    [[[future_subsection]]]
      example = "unknown # value"
  [["Personal [quoted] profile"]]
    font = Monospace 15
    cursor_bg_color = "#333333"
    cursor_fg_color = "#EEEEEE"
    custom_command = '''echo synthetic
[not a real section]
[[not a real profile]]
echo done'''
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[terminal0]]]
      type = Terminal
      parent = window0
      profile = default
[plugins]
  [[TestSynthetic]]
    api_key = SYNTHETIC_NOT_A_SECRET
[unknown_section]
  [[unrecognized]]
    untouched = Yes
